<style>

  .card-h{padding:14px 16px 12px;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .card-t{font-size:15px;font-weight:800}
  .card-f{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin-top:3px;word-break:break-all}

  .subj{padding:11px 16px;border-bottom:1px solid var(--line-soft);background:rgba(236,239,244,.55);display:flex;gap:8px;align-items:baseline}
  .subj-k{flex:none;font-size:10.5px;font-weight:800;color:var(--muted)}
  .subj-v{font-size:12.5px;line-height:1.5;word-break:break-word}
  .var{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:rgba(46,140,255,.15);color:var(--accent-ink);padding:1px 5px;border-radius:5px;white-space:nowrap}

  .cseg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px}
  .cseg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:5px 14px;border-radius:999px;cursor:pointer}
  .cseg button.on[data-g="before"]{background:var(--before);color:#fff}
  .cseg button.on[data-g="after"]{background:var(--after);color:#fff}
  .phone{width:360px;max-width:100%;border-radius:24px;background:var(--frame);padding:8px;box-shadow:0 16px 40px rgba(0,0,0,.18)}
  .screen{border-radius:16px;overflow:hidden;background:#fff;height:600px;position:relative}
  .screen iframe{width:360px;max-width:100%;height:100%;border:0;display:block;background:#fff}
  .screen .ph{position:absolute;inset:0;display:grid;place-items:center;color:#9aa;font-size:13px}
  body.darkbg .screen{background:#0b0d11}
  .foot{max-width:1200px;margin:0 auto;padding:0 24px 48px;color:var(--muted);font-size:12px;text-align:center}

[].forEach.call(document.querySelectorAll('.seg-b'),function(btn){btn.onclick=function(){g=btn.dataset.g;document.querySelectorAll('.seg-b').forEach(function(x){x.classList.toggle('on',x.dataset.g===g)});document.querySelectorAll('.card').forEach(function(c){setCard(c)});};});
document.getElementById('bgt').onclick=function(){var on=document.body.classList.toggle('darkbg');this.textContent=on?'☀️ 라이트 배경':'🌙 다크 배경';};
function pathOf(it){return (g==='before'?'/before/':'/')+it.dir+'/'+it.id+'.html';}
function setCard(card){var it=card._it;card.querySelectorAll('.cseg button').forEach(function(x){x.classList.toggle('on',x.dataset.g===g)});card.querySelector('.subj-v').innerHTML=chips(subjOf(it));card._loaded=null;load(card);}
function load(card){if(!card._vis)return;var key=g;if(card._loaded===key)return;card._loaded=key;var ph=card.querySelector('.ph');if(ph)ph.style.display='';fetch(pathOf(card._it)).then(function(r){return r.text();}).then(function(h){if(card._loaded!==key)return;card._frame.srcdoc=replaceVars(h,EX_IMG);}).catch(function(){card._frame.srcdoc='<p style="padding:20px;color:#94A3B8">불러오기 실패</p>';});}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target._vis=true;load(e.target);}});},{rootMargin:'400px'});
function render(){main.innerHTML='';io.disconnect();var wrap=document.createElement('div');wrap.className='grid';
CATS[active].items.forEach(function(it){var card=document.createElement('div');card.className='card';card._it=it;
card.innerHTML='<div class="card-h"><div><div class="card-t"></div><div class="card-f"></div></div><span class="tag">'+it.dir+'</span></div>'+
'<div class="subj"><span class="subj-k">제목</span><span class="subj-v"></span></div>'+
'<div class="card-c"><div class="cseg"><button data-g="before">수정 전</button><button data-g="after" class="on">수정 후</button></div>'+
'<div class="phone"><div class="screen"><div class="ph">불러오는 중…</div><iframe loading="lazy"></iframe></div></div></div>';
card.querySelector('.card-t').textContent=it.title;card.querySelector('.card-f').textContent=it.id+'.html';
card.querySelector('.subj-v').innerHTML=chips(subjOf(it));
card._frame=card.querySelector('iframe');
card._frame.addEventListener('load',function(){var ph=card.querySelector('.ph');if(ph)ph.style.display='none';});
card.querySelectorAll('.cseg button').forEach(function(btn){btn.classList.toggle('on',btn.dataset.g===g);btn.onclick=function(){g=btn.dataset.g;document.querySelectorAll('.seg-b').forEach(function(x){x.classList.toggle('on',x.dataset.g===g)});document.querySelectorAll('.card').forEach(function(c){setCard(c)});};});
wrap.appendChild(card);io.observe(card);});
main.appendChild(wrap);}
render();
</script>
