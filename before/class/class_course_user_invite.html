<!DOCTYPE html>
<html>

<head>
    <meta content='width=device-width, initial-scale=1, maximum-scale=1' name='viewport'>
    <meta charset='UTF-8'>
    <style>
        @media only screen and (max-width:640px) {

            .stb-left-cell,
            .stb-right-cell {
                max-width: 100% !important;
                width: 100% !important;
            }

            .stb-left-cell img,
            .stb-right-cell img {
                width: 100%;
                height: auto;
            }

            .stb-left-cell>div {
                padding: 5px 10px !important;
                box-sizing: border-box;
            }

            .stb-right-cell>div {
                padding: 5px 10px !important;
                box-sizing: border-box;
            }

            .stb-cell-wrap {
                padding: 0 0 0 0 !important;
            }

            .stb-cell-wrap>tr>td {
                padding: 0 0 !important;
            }

            .stb-cell-wrap>tbody>tr>td {
                padding: 0 0 !important;
            }

            .stb-cell-wrap>tbody>tr>td.stb-text-box {
                padding: 0 10px !important;
            }

            .stb-left-cell>div.stb-text-box {
                padding: 5px 10px !important;
            }

            .stb-right-cell>div.stb-text-box {
                padding: 5px 10px !important;
            }

            .stb-container {
                width: 94% !important
            }

            .stb-container a {
                text-decoration: underline;
            }

            .stb-cta-only-wrap {
                padding: 10px 0 !important;
            }
        }
    </style>
</head>

<body>
<div class="stb-container-full" style="width:100%; padding:40px 0; background-color:#ffffff; margin: 0 auto;">
    <table class="stb-container" cellpadding="0" cellspacing="0" align="center"
           style="margin: 0px auto; width: 94%; max-width: 630px; background: rgb(255, 255, 255); border: 0px;">
        <tbody>
        <tr style="margin: 0;padding:0;">
            <td
                    style="width: 100%; max-width: 630px; margin: 0 auto; position: relative; border-spacing: 0; clear: both; border-collapse: separate;padding:0;overflow:hidden;_width:620px;">
                <div
                        style="height: 0px; max-height: 0px; border-width: 0px; border-color: initial; border-image: initial; visibility: hidden; line-height: 0px; font-size: 0px; overflow: hidden;display:none;">
                </div>

                       style="overflow: hidden; margin: 0px auto; padding: 0px; width:100%;max-width: 630px; clear: both; background: none;border:0;"

                                        width="100%">
                                        <div style="text-align: right;"><a href="$%permalink%$"
                                                                           target="_blank"

                                </tr>
                                </tbody>
                            </table>

                    </tr>

                </table>

                                            </div>

                                                    style="font-weight: bold;">$%class_name%$</span>

                                            <div style="font-size: 18px;"><br></div>
                                            <div>이 초대를 수락하시려면&nbsp;<span style="color: rgb(0, 0, 0);">아래
                                                                    버튼을 클릭하신 뒤 사이트 우측 상단에서</span>&nbsp;<span
                                                    style="font-weight: bold; color: rgb(46, 140, 255);">[로그인]</span>을

                                                        style="font-weight: bold; color: rgb(46, 140, 255);">[참여하기]</span>

                                    <tbody>
                                    <tr>
                                        <td style="line-height:1.5;padding: 14px 20px 11px;"
                                            align="center"><a href="$%course_user_invite_url%$"
                                                              style="font-size: 16px; display: inline; color: rgb(255, 255, 255); background: rgb(46, 140, 255); border-radius: 3px; text-decoration: none; outline: 0px; font-family: AppleSDGothic, apple sd gothic neo, noto sans korean, noto sans korean regular, noto sans cjk kr, noto sans cjk, nanum gothic, malgun gothic, dotum, arial, helvetica, MS Gothic, sans-serif; text-align: center;"
                                                              target="_blank">초대 수락하기</a></td>
                                    </tr>

                                </table>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>

                       style="overflow: hidden; margin: 0px auto; padding: 0px; width:100%;max-width: 630px; clear: both; background: none;border:0;"
                       width="100%">
                    <tbody>
                    <tr>
                        <td style="padding: 20px 0 20px 0;line-height: 1.8; border-width: 0px;">
                            <table class="stb-cell-wrap" border="0" cellpadding="0" cellspacing="0"
                                   style="padding: 0px 0;" width="100%">
                                <tbody>
                                <tr>
                                    <td style="padding: 0 0">
                                        <div
                                                style="height: 0; background: none; padding: 0px; border-top-width:1px;border-top-style:solid;border-top-color:#999;margin:0 15px">
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <table class="stb-block" border="0" cellpadding="0" cellspacing="0"
                       style="overflow: hidden; margin: 0px auto; padding: 0px; width:100%;max-width: 630px; clear: both; background: none;border:0;"
                       width="100%">
                    <tbody>
                    <tr>
                        <td
                                style="padding: 20px 0 20px 0; line-height: 1.8; border-width: 0px;font-size: 14px;">
                            <table class="stb-cell-wrap" border="0" cellpadding="0" cellspacing="0"
                                   style="padding: 0px 5px;" width="100%">

                                <tr>

                                        width="100%">
                                        <div style="text-align: center;"><span
                                                style="font-family: AppleSDGothic, &quot;apple sd gothic neo&quot;, &quot;noto sans korean&quot;, &quot;noto sans korean regular&quot;, &quot;noto sans cjk kr&quot;, &quot;noto sans cjk&quot;, &quot;nanum gothic&quot;, &quot;malgun gothic&quot;, dotum, arial, helvetica, MS Gothic, sans-serif; font-style: normal;"><span
                                                style="color: rgb(109, 107, 109);"><a href="$%site_url%$/unsubscribe-email?email=$%user_email%$" style="padding: 0px 18px 9px;color: #808080;">수신거부</a></span></span>
                                        </div>
                                        <div style="text-align: center;"><span
                                                style="font-family: AppleSDGothic, &quot;apple sd gothic neo&quot;, &quot;noto sans korean&quot;, &quot;noto sans korean regular&quot;, &quot;noto sans cjk kr&quot;, &quot;noto sans cjk&quot;, &quot;nanum gothic&quot;, &quot;malgun gothic&quot;, dotum, arial, helvetica, MS Gothic, sans-serif; font-style: normal;">ⓒ
                                                                Futureschole</span></div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</html>
